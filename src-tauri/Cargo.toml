[package]
name = "voiceassist"
version = "1.7.1"
description = "VoiceAssist - 为语言障碍者打造的文本转语音沟通助手"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voiceassist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
rodio = "0.20"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
futures-util = "0.3"
base64 = "0.22"
async-trait = "0.1"
libloading = "0.8"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
plugin-api = { path = "../plugins/plugin-api" }
# 只用 time（插件合成超时控制）；运行时时钟由 tauri 的 tokio 运行时提供
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

