# kothok-edge-tts（vendored 补丁版）
#
# ⚠️ 这是 crates.io kothok-edge-tts 0.2.10 的仓库内补丁副本（MIT，原作者 Nayeem Bin Ahsan），
# 由 [patch.crates-io]（plugins/Cargo.toml）接管解析。不要直接改它的协议逻辑；
# 升级思路：上游若发布修复版，移除 patch 段回归 crates.io，并删除本目录。
#
# vendored 原因（2026-10-26）：微软对 Edge Read-Aloud 的 Sec-MS-GEC 校验升级到 v2
# （分阶段上线，v1 握手一律 403，见 rany2/edge-tts#490），上游 0.2.10 未跟进。
# 本副本把令牌生成换成 v2（CS64 + 调整版 SHA-256，移植自 MIT 的 rany2/edge-tts 7.3.0
# drm.py），Sec-MS-GEC-Version 由 1- 改为 2- 前缀。端点/协议/其余逻辑不变。

[package]
name = "kothok-edge-tts"
version = "0.2.11"
edition = "2021"
rust-version = "1.75"
description = "Microsoft Edge online text-to-speech client (vendored: Sec-MS-GEC v2 token fix)"
license = "MIT"
repository = "https://github.com/Nayeem170/kothok-edge-tts"

[lib]
name = "kothok_edge_tts"
path = "src/lib.rs"

[dependencies]
futures-util = "0.3"
log = "0.4"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt", "time", "net", "io-util"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
webpki-roots = "0.26"
