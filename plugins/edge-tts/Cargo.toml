[package]
name = "edge-tts"
version = "0.1.0"
description = "Edge TTS 插件：免费、无需 Key 的微软 Edge 语音（非官方接口，可能不稳定）"
edition = "2021"

[lib]
# 插件必须是动态库（Windows 上产出 edge_tts.dll，打包时改名 plugin.dll）
crate-type = ["cdylib"]

[dependencies]
plugin-api = { path = "../plugin-api" }
kothok-edge-tts = "0.2"
# 插件合成入口是同步 C ABI，内部用自建运行时跑异步合成
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
serde_json = "1"
