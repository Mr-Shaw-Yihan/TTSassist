[package]
name = "fish-audio-tts"
version = "0.1.0"
description = "Fish Audio TTS 插件 — 调用 api.fish.audio 云端语音合成"
edition = "2021"

[lib]
# 插件必须是动态库（Windows 上产出 fish_audio_tts.dll，打包时改名 plugin.dll）
crate-type = ["cdylib"]

[dependencies]
plugin-api = { path = "../../plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

# 读取 Windows 系统代理设置（api.fish.audio 国内直连常超时，系统代理是刚需）
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
libloading = "0.8"
