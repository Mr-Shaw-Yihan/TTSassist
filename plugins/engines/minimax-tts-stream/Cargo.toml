[package]
name = "minimax-tts-stream"
version = "0.2.0"
description = "MiniMax 流式 TTS 插件 — WebSocket T2A v2 边合成边出块（国内版，支持克隆音色）"
edition = "2021"

[lib]
# 插件必须是动态库（Windows 上产出 minimax_tts_stream.dll，打包时改名 plugin.dll）
crate-type = ["cdylib"]

[dependencies]
plugin-api = { path = "../../plugin-api" }
minimax-tts-core = { path = "../../shared/minimax-tts-core" }

[dev-dependencies]
serde_json = "1"
